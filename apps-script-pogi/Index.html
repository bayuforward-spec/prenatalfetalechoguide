<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1020;--card:#141a30;--card2:#1b2240;--txt:#e8ecff;--mut:#93a0c8;--line:#2a3358}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1b2554 0%,var(--bg) 55%);color:var(--txt);padding:28px 18px 60px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto}
header.top{text-align:center;margin-bottom:26px}
header.top h1{font-size:30px;letter-spacing:.3px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top p{color:var(--mut);margin-top:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.stat .num{font-size:34px;font-weight:700}
.stat .lab{color:var(--mut);font-size:13px;margin-top:4px}
.stat .spark{position:absolute;right:-10px;top:-10px;font-size:64px;opacity:.08}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel h2 .ic{font-size:18px}
.col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}.col5{grid-column:span 5}.col7{grid-column:span 7}
@media(max-width:880px){.col8,.col6,.col4,.col5,.col7{grid-column:span 12}}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{border-radius:50%;position:relative;flex:0 0 auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.donut-hole{position:absolute;inset:24%;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-hole span{font-size:26px;font-weight:700}.donut-hole small{color:var(--mut);font-size:11px}
ul.legend{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
ul.legend li{display:flex;align-items:center;gap:8px}
ul.legend .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
ul.legend .pct{color:var(--mut)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:155px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.bar-lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:#0d1430;border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:8px;transition:width .6s}
.bar-val{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{background:#0d1430;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.chip b{color:#67e8f9}
ul.plain{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
ul.plain li{background:#0d1430;border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between}
ul.plain b{color:#6ee7b7}
table{width:100%;border-collapse:collapse;font-size:12.7px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card2)}
td.c,th.c{text-align:center}
.tablewrap{max-height:430px;overflow:auto;border-radius:12px;border:1px solid var(--line)}
.warn{border-color:#7c4a12;background:linear-gradient(160deg,#241a0f,#1a1407)}
.warn h2{color:#fbbf24}
.warn ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px}
.warn li{padding-left:22px;position:relative;color:#f0e6d2}
.warn li:before{content:"⚠";position:absolute;left:0;color:#fbbf24}
.warn .tag{color:#fbbf24;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:30px;line-height:1.7}
.loading{text-align:center;padding:80px 20px;color:var(--mut)}
.spinner{width:42px;height:42px;border:4px solid var(--line);border-top-color:#67e8f9;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh{position:fixed;right:18px;bottom:18px;background:#6366f1;color:#fff;border:none;border-radius:50px;padding:12px 18px;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.4)}
.refresh:hover{background:#7c7ff5}
</style>
</head>
<body>
<div class="wrap">
  <div id="app">
    <div class="loading"><div class="spinner"></div>Memuat data live dari Google Sheet…</div>
  </div>
</div>
<button class="refresh" onclick="load()">↻ Refresh data</button>

<script>
var PALETTE=["#6366f1","#22d3ee","#34d399","#fbbf24","#f472b6","#a78bfa","#fb7185","#38bdf8","#4ade80","#facc15","#c084fc","#2dd4bf"];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function donut(obj,size){
  size=size||170;
  var items=Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
  var total=items.reduce(function(s,x){return s+x[1];},0)||1;
  var acc=0,stops=[],legend='';
  items.forEach(function(it,i){
    var col=PALETTE[i%PALETTE.length];
    var start=acc/total*360; acc+=it[1]; var end=acc/total*360;
    stops.push(col+' '+start.toFixed(1)+'deg '+end.toFixed(1)+'deg');
    legend+='<li><span class="dot" style="background:'+col+'"></span>'+esc(it[0])+' <b>'+it[1]+'</b> <span class="pct">('+Math.round(it[1]/total*100)+'%)</span></li>';
  });
  return '<div class="donut-wrap"><div class="donut" style="width:'+size+'px;height:'+size+'px;background:conic-gradient('+stops.join(',')+')">'+
         '<div class="donut-hole"><span>'+total+'</span><small>total</small></div></div><ul class="legend">'+legend+'</ul></div>';
}
function bars(pairs,accent){
  accent=accent||'#6366f1';
  var mx=pairs.reduce(function(m,x){return Math.max(m,x[1]);},0)||1,rows='';
  pairs.forEach(function(it){
    rows+='<div class="bar-row"><div class="bar-lab">'+esc(it[0])+'</div><div class="bar-track">'+
          '<div class="bar-fill" style="width:'+(it[1]/mx*100).toFixed(1)+'%;background:'+accent+'"></div></div>'+
          '<div class="bar-val">'+it[1]+'</div></div>';
  });
  return '<div class="bars">'+rows+'</div>';
}
function objBars(obj,order,accent){
  var pairs = order ? order.filter(function(k){return obj[k]!==undefined;}).map(function(k){return [k,obj[k]];})
                    : Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
  return bars(pairs,accent);
}

function load(){
  document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div>Memuat data live dari Google Sheet…</div>';
  google.script.run.withSuccessHandler(render).withFailureHandler(function(e){
    document.getElementById('app').innerHTML='<div class="loading">⚠ Gagal memuat: '+esc(e.message||e)+'</div>';
  }).getDashboardData();
}

function render(d){
  var q=d.quality;
  function qList(arr){ return arr.length? arr.map(function(x){return esc(x);}).join('; ') : '—'; }

  var roster=d.roster.map(function(r){
    return '<tr><td>'+esc(r[0])+'</td><td class="c">'+r[1]+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td class="c">'+(r[5]?'✅':'—')+'</td></tr>';
  }).join('');

  var html=''+
  '<header class="top"><h1>Dashboard Anggota POGI Lampung</h1>'+
  '<p>Sumber: Google Form “DATA POGI” · Data live diperbarui '+esc(d.updated)+' · '+d.unique+' anggota unik</p></header>'+

  '<div class="stats">'+
    stat('👥',d.total,'Total responden')+
    stat('✔️',d.unique,'Anggota unik (dedup)')+
    stat('🎯',d.ya+' <span style="font-size:16px;color:var(--mut)">/'+d.unique+'</span>','Sudah ikut ONE POGI ('+d.pctYa+'%)')+
    stat('🎓',d.subspesialis,'Subspesialis')+
    stat('🎂',d.avgAge,'Rata-rata usia (thn)')+
  '</div>'+

  '<div class="grid">'+
    panel('col7','🗺️','Pemetaan Wilayah Domisili', bars(d.region,'#22d3ee'))+
    panel('col5','🎯','Status ONE POGI 2026', donut(d.pogi)+
        '<div class="mini"><span class="chip">Sudah ikut <b>'+d.ya+'</b></span><span class="chip">Belum ikut <b>'+d.tidak+'</b></span></div>')+

    panel('col7','🎂','Distribusi Usia', bars(d.ageBuckets,'#a78bfa')+
        '<div class="mini"><span class="chip">Termuda <b>'+d.minAge+'</b></span><span class="chip">Tertua <b>'+d.maxAge+'</b></span>'+
        '<span class="chip">Rata-rata <b>'+d.avgAge+'</b></span>'+(d.invalidAge?'<span class="chip" style="opacity:.7">'+d.invalidAge+' data lahir invalid dikecualikan</span>':'')+'</div>')+
    panel('col5','📅','Mulai Ikut ONE POGI (sejak)', bars(d.since,'#34d399'))+

    panel('col7','🏥','Tempat Praktek Terbanyak', bars(d.hosp,'#f472b6')+
        '<p style="color:var(--mut);font-size:11.5px;margin-top:10px">Jumlah dokter yang menyebut fasilitas tsb pada instansi/SIP (estimasi dari teks bebas).</p>')+
    panel('col5','🧑‍⚕️','Status Kepegawaian', donut(d.kepeg))+

    panel('col5','🎓','Jenjang Pendidikan', objBars(d.jenjang,['Subspesialis','Spesialis Obgyn','S1/profesi dokter'],'#6366f1'))+
    panel('col7','❌','Alasan Belum Ikut ONE POGI ('+d.tidak+' orang)',
        '<ul class="plain">'+d.reasons.map(function(r){return '<li>'+esc(r[0])+' <b>'+r[1]+'</b></li>';}).join('')+'</ul>')+

    panel('col4','🕌','Agama', donut(d.agama,150))+
    panel('col4','💍','Status Pernikahan', donut(d.nikah,150))+
    panel('col4','🛡️','Asuransi Profesi Lain', donut(d.asuransi,150))+

    panel('col12','📋','Daftar Anggota (per wilayah)',
        '<div class="tablewrap"><table><thead><tr><th>Nama</th><th class="c">Usia</th><th>Wilayah Domisili</th><th>Jenjang</th><th>Kepegawaian</th><th class="c">ONE POGI</th></tr></thead><tbody>'+roster+'</tbody></table></div>')+

    '<div class="panel col12 warn"><h2><span class="ic">⚠️</span>Catatan Kualitas Data (perlu dicek manual)</h2><ul>'+
      '<li><span class="tag">Duplikat (No HP sama):</span> '+qList(q.duplicates)+'</li>'+
      '<li><span class="tag">Kolom bergeser (email/nama tertukar):</span> '+qList(q.shifted)+'</li>'+
      '<li><span class="tag">Tanggal lahir tidak valid:</span> '+qList(q.invalidBirth)+'</li>'+
      '<li><span class="tag">Instansi kosong:</span> '+qList(q.emptyInstansi)+'</li>'+
      '<li><span class="tag">Jenjang hanya S1 (perlu konfirmasi):</span> '+qList(q.s1only)+'</li>'+
      '<li><span class="tag">Alamat sama (kemungkinan pasangan / duplikat):</span> '+qList(q.couples)+'</li>'+
    '</ul></div>'+
  '</div>'+

  '<footer>Data bersifat rahasia — dashboard menampilkan agregat &amp; nama, tanpa No HP/email/alamat.<br>'+
  'Live dari Google Sheet via Apps Script · Klik ↻ untuk muat ulang data terbaru.</footer>';

  document.getElementById('app').innerHTML=html;
}

function stat(ic,num,lab){ return '<div class="stat"><div class="spark">'+ic+'</div><div class="num">'+num+'</div><div class="lab">'+lab+'</div></div>'; }
function panel(col,ic,title,body){ return '<div class="panel '+col+'"><h2><span class="ic">'+ic+'</span>'+title+'</h2>'+body+'</div>'; }

load();
</script>
</body>
</html>
